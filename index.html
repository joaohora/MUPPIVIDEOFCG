<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Digital Signage Vimeo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: black;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        border: none;
      }
    </style>
  </head>
  <body>
    <iframe 
      src="https://player.vimeo.com/video/1080584429?autoplay=1&muted=1&background=1&loop=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </body>
</html>
